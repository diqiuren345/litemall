# SonarQube 扫描配置（实验一基线）
sonar.projectKey=litemall
sonar.projectName=litemall
sonar.projectVersion=0.1.0
sonar.sourceEncoding=UTF-8
sonar.java.source=1.8
sonar.host.url=http://localhost:9000

# 只分析后端 Java 模块；前端三个目录不在 Maven modules 里，本身不会被扫到
sonar.sources=litemall-core/src/main/java,litemall-db/src/main/java,litemall-wx-api/src/main/java,litemall-admin-api/src/main/java,litemall-all/src/main/java,litemall-all-war/src/main/java

# 排除生成物与第三方
sonar.exclusions=**/node_modules/**,**/target/**
